name: Build & Deploy WebGL

# SAME FILE IN EVERY PO UNITY GAME. The reference copy is PoBox's; copy it with
# PoPunkouterSoftware/scripts/sync-ci.ps1, never edit one game's copy. What differs per game
# (builder method, Static Web App, resource group) lives in Tools/webgl.json.
#
# It runs on the self-hosted `unity` runner (the dev PC), which has Unity, its license and the az
# login. Push-only on purpose: the repo is public, and a pull_request trigger would let anyone's
# fork run code on that PC. Never add one.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgl-${{ github.repository }}
  cancel-in-progress: true

jobs:
  webgl:
    runs-on: [self-hosted, unity]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          # Keeps Library/ (git-ignored) between runs: a cold Unity import takes up to an hour.
          clean: false
          lfs: true
      - name: Build, deploy and check the live page
        shell: pwsh
        run: ./Tools/ci_webgl.ps1

name: Deploy WebGL

# PoOlympic's one workflow.
#   push to master      -> Python checks: ruff check, ruff format --check, the fast pytest tier (CPU).
#   release webgl-*     -> deploy that release's webgl.zip to the Azure Static Web App, then check the live page and /diag.
#   workflow_dispatch   -> re-deploy a webgl-* release (empty tag = the newest).
#
# The WebGL player is built LOCALLY with the exact pinned Unity (Unity cannot be licensed in CI) by
# scripts/publish_webgl.ps1, which runs the EditMode tests first and publishes the zip as a webgl-* release.
#
# Repo secret: AZURE_STATIC_WEB_APPS_API_TOKEN (the game's Static Web App deployment token).
on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: webgl-* release tag to deploy (empty = newest)
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
      - name: ruff check
        run: uvx ruff check .
      - name: ruff format --check
        run: uvx ruff format --check .
      - name: pytest (fast tier)
        working-directory: training
        run: |
          # CPU torch on the runner (the uv project pins the CUDA wheel index for the training PC)
          uv venv --python 3.11 .ci-venv
          uv pip install --python .ci-venv "mujoco==3.11.0" "mujoco-warp==3.11.0" "mjlab==1.6.0" onnx onnxruntime numpy pytest \
            torch --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          uv pip install --python .ci-venv --no-deps -e .
          .ci-venv/bin/python -m pytest tests -q -m "not slow"

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'webgl-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the WebGL build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("webgl-"))] | sort_by(.createdAt) | last | .tagName')
          fi
          test -n "$TAG" || { echo "No webgl-* release. Run scripts/publish_webgl.ps1 first."; exit 1; }
          echo "Deploying $TAG"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p webgl.zip -D .
          mkdir site && unzip -q webgl.zip -d site
          test -f site/index.html || { echo "webgl.zip of $TAG has no index.html at its root"; exit 1; }
          test -f site/diag.html || { echo "webgl.zip of $TAG has no diag.html"; exit 1; }
          test -f site/staticwebapp.config.json || { echo "webgl.zip of $TAG has no staticwebapp.config.json (.unityweb would 404)"; exit 1; }

      - name: Deploy to Azure Static Web App
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

      # The page is live, is this build (same vYYMMDD as the zip), and /diag answers with the same stamp.
      - name: Check the live page and /diag
        env:
          URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          STAMP=$(grep -o 'class="po-version">v[0-9]\{6\}' site/index.html | grep -o '[0-9]\{6\}')
          echo "Expecting v$STAMP"
          for i in $(seq 1 20); do
            page=$(curl -fsS --max-time 30 "$URL/" || true)
            if echo "$page" | grep -q 'loader.js' && echo "$page" | grep -q "v$STAMP"; then
              diag=$(curl -fsS --max-time 30 "$URL/diag" || true)
              if echo "$diag" | grep -q '<title>System status</title>' && echo "$diag" | grep -q "v$STAMP"; then
                echo "Live: $URL (v$STAMP) and $URL/diag"; exit 0
              fi
            fi
            sleep 15
          done
          echo "$URL did not serve v$STAMP with a matching /diag"; exit 1

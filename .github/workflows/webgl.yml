name: Deploy WebGL

# PoOlympic's one workflow.
#   every push to master, pull request, release and manual run -> Python checks: ruff check, ruff format --check, the
#                         fast pytest tier (CPU).
#   release webgl-*     -> after the Python checks: deploy that release's webgl.zip to the Azure Static Web App with the
#                         release's commit stamped into every response as X-Commit, then check that the live page is this
#                         build (X-Commit = that commit, its vYYMMDD) and that /diag answers with the same stamp.
#   workflow_dispatch   -> the same for an existing webgl-* release (empty tag = the newest).
#
# The WebGL player is built LOCALLY with the exact pinned Unity (Unity cannot be licensed in CI) by
# scripts/publish_webgl.ps1, which runs the EditMode tests first and publishes the zip as a webgl-* release.
#
# Repo secret: AZURE_STATIC_WEB_APPS_API_TOKEN (the game's Static Web App deployment token).
on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: webgl-* release tag to deploy (empty = newest)
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
      - name: ruff check
        run: uvx ruff check .
      - name: ruff format --check
        run: uvx ruff format --check .
      - name: pytest (fast tier)
        working-directory: Training
        run: |
          # CPU torch on the runner (the uv project pins the CUDA wheel index for the training PC)
          uv venv --python 3.11 .ci-venv
          uv pip install --python .ci-venv "mujoco==3.11.0" "mujoco-warp==3.11.0" "mjlab==1.6.0" onnx onnxruntime numpy pytest \
            torch --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          # mjviser (an mjlab dependency) pulls mujoco-core 4.x, whose files share the mujoco/ package folder: put
          # mujoco 3.11.0's own files back last so its bundled plugins find libmujoco.so.3.11.0
          uv pip install --python .ci-venv --reinstall-package mujoco --no-deps "mujoco==3.11.0"
          uv pip install --python .ci-venv --no-deps -e .
          .ci-venv/bin/python -m pytest tests -q -m "not slow"

  deploy:
    needs: python
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'webgl-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the WebGL build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("webgl-"))] | sort_by(.createdAt) | last | .tagName')
          fi
          test -n "$TAG" || { echo "No webgl-* release. Run scripts/publish_webgl.ps1 first."; exit 1; }
          echo "Deploying $TAG"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p webgl.zip -D .
          mkdir site && unzip -q webgl.zip -d site
          test -f site/index.html || { echo "webgl.zip of $TAG has no index.html at its root"; exit 1; }
          test -f site/diag.html || { echo "webgl.zip of $TAG has no diag.html"; exit 1; }
          test -f site/staticwebapp.config.json || { echo "webgl.zip of $TAG has no staticwebapp.config.json (.unityweb would 404)"; exit 1; }
          # The commit the build was made from (the release is tagged at it) goes into every response as X-Commit.
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          test -n "$SHA" || { echo "Cannot resolve $TAG to a commit"; exit 1; }
          jq --arg sha "$SHA" '.globalHeaders = ((.globalHeaders // {}) + {"X-Commit": $sha})' site/staticwebapp.config.json > swa.json
          mv swa.json site/staticwebapp.config.json
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Deploy to Azure Static Web App
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

      # The page is live and is this build (X-Commit = the release's commit, same vYYMMDD as the zip), and /diag answers
      # with the same stamp.
      - name: Check the live page, X-Commit and /diag
        env:
          URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          STAMP=$(grep -o 'class="po-version">v[0-9]\{6\}' site/index.html | grep -o '[0-9]\{6\}')
          echo "Expecting v$STAMP at X-Commit $SHA"
          for i in $(seq 1 20); do
            live=$(curl -fsS -o /dev/null -D - --max-time 30 "$URL/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit"{print $2}')
            page=$(curl -fsS --max-time 30 "$URL/" || true)
            if [ "$live" = "$SHA" ] && echo "$page" | grep -q 'loader.js' && echo "$page" | grep -q "v$STAMP"; then
              diag=$(curl -fsS --max-time 30 "$URL/diag" || true)
              if echo "$diag" | grep -q '<title>System status</title>' && echo "$diag" | grep -q "v$STAMP"; then
                echo "Live: $URL at X-Commit $live (v$STAMP) and $URL/diag"; exit 0
              fi
            fi
            echo "waiting: X-Commit '$live', want $SHA"
            sleep 15
          done
          echo "$URL did not serve this build (X-Commit $SHA, v$STAMP) with a matching /diag"; exit 1

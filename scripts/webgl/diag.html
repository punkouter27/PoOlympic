<!doctype html>
<!-- /diag of the WebGL site. scripts/publish_webgl.ps1 fills {{NAME}}, {{VERSION}} and {{CHECKS}} (the diagChecks
     of scripts/webgl.json plus one check per file of the build bundle) and writes it as diag.html next to index.html.
     Every row is probed live from the visitor's browser; nothing is shown as healthy without a request. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f17">
<link rel="icon" href="data:,">
<title>System status</title>
<style>
  :root { --bg: #0b0f17; --surface: #121826; --line: #1f2937; --text: #e6e9f2; --muted: #9aa3b5; --accent: #6366f1;
          --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, sans-serif; }
  header { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
           background: var(--surface); border-bottom: 1px solid var(--line); }
  header a { color: var(--text); text-decoration: none; font-weight: 600; }
  header a.back { color: var(--muted); font-weight: 500; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 24px 0 8px; }
  .banner { padding: 12px 16px; border-radius: 8px; background: var(--surface); border-left: 4px solid var(--muted); font-weight: 600; }
  .banner.ok { border-color: var(--ok); } .banner.warn { border-color: var(--warn); } .banner.bad { border-color: var(--bad); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 14px; margin-bottom: 8px;
         background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .label { font-weight: 600; } .purpose, .detail { color: var(--muted); font-size: 13px; grid-column: 1 / -1; word-break: break-word; }
  .right { display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
  .pill { padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #0b0f17; background: var(--muted); }
  .pill.Off { background: var(--line); color: var(--muted); }
  .pill.Healthy { background: var(--ok); } .pill.Degraded { background: var(--warn); } .pill.Unhealthy { background: #b91c1c; color: #fff; }
  .ms { color: var(--muted); font-size: 12px; min-width: 56px; text-align: right; }
  footer { position: fixed; right: 10px; bottom: 4px; font-size: 12px; color: var(--muted); }
  /* on a phone the stamp follows the content instead of floating over the last rows */
  @media (max-width: 600px) { footer { position: static; text-align: right; padding: 0 16px 12px; } main { padding-bottom: 8px; } }
</style>
</head>
<body>
<header><a href="/">{{NAME}}</a><a class="back" href="/">Back to the game</a></header>
<main>
  <h1>System status</h1>
  <div id="banner" class="banner">Checking…</div>
  <h2>API</h2><div id="api"></div>
  <h2>Data</h2><div id="data"></div>
  <h2>Services</h2><div id="service"></div>
  <p class="purpose" id="checked"></p>
</main>
<footer>v{{VERSION}}</footer>
<script>
  const CHECKS = {{CHECKS}};
  const SLOW_MS = 3000;

  function row(c) {
    const el = document.createElement("div");
    el.className = "row";
    el.innerHTML = '<span class="label"></span><span class="right"><span class="ms"></span><span class="pill">…</span></span>' +
                   '<span class="purpose"></span><span class="detail"></span>';
    el.querySelector(".label").textContent = c.label;
    el.querySelector(".purpose").textContent = c.purpose || "";
    document.getElementById(c.group).appendChild(el);
    return el;
  }

  function show(el, status, ms, detail) {
    el.dataset.result = JSON.stringify([status, ms, detail || ""]);
    const pill = el.querySelector(".pill");
    pill.textContent = status; pill.className = "pill " + status;
    el.querySelector(".ms").textContent = ms == null ? "" : Math.round(ms) + " ms";
    el.querySelector(".detail").textContent = detail || "";
    return status;
  }

  // Results are kept for MAX_AGE_S in this tab (sessionStorage) so reloading /diag does not re-probe every service;
  // /diag?fresh (the "Re-check now" link) always probes again.
  const MAX_AGE_S = 60;
  const STORE_KEY = "poolympic.diag.v{{VERSION}}";
  const FRESH = new URLSearchParams(location.search).has("fresh");

  function cached() {
    if (FRESH) return null;
    try {
      const c = JSON.parse(sessionStorage.getItem(STORE_KEY) || "null");
      if (c && Array.isArray(c.rows) && c.rows.length === CHECKS.length && Date.now() - c.at < MAX_AGE_S * 1000) return c;
    } catch (e) { /* storage blocked or corrupt: probe */ }
    return null;
  }

  async function probeInto(el, c) {
    const t0 = performance.now();
    // No URL = a dependency switched off on purpose: neutral "Off", not counted in the banner.
    if (c.kind === "off" || (!c.url && c.kind !== "webgl2")) return show(el, "Off", null, c.offReason || "Switched off on purpose");
    try {
      if (c.kind === "webgl2") {
        const gl = document.createElement("canvas").getContext("webgl2");
        const info = gl && gl.getExtension("WEBGL_debug_renderer_info");
        const what = gl ? (info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)) : "";
        return show(el, gl ? "Healthy" : "Unhealthy", performance.now() - t0, gl ? what : "This browser has no WebGL2: the game cannot start.");
      }
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch(c.url, { method: c.kind === "commit" ? "HEAD" : (c.method || "GET"), cache: "no-store", signal: ctl.signal });
      clearTimeout(timer);
      const ms = performance.now() - t0;
      if (!r.ok) return show(el, "Unhealthy", ms, `HTTP ${r.status} from ${c.url}`);
      let detail = `HTTP ${r.status}`;
      if (c.kind === "commit") {
        const sha = r.headers.get("x-commit");
        if (!sha) return show(el, "Unhealthy", ms, "no X-Commit header on the page (not deployed by the workflow?)");
        return show(el, ms > SLOW_MS ? "Degraded" : "Healthy", ms, `X-Commit ${sha.slice(0, 7)}`);
      }
      if (c.kind === "page") {
        const text = await r.text();
        if (!text.includes("loader.js")) return show(el, "Unhealthy", ms, "the page does not load the Unity player");
        if (!text.includes("v{{VERSION}}")) return show(el, "Unhealthy", ms, "the page is another build than v{{VERSION}}");
        return show(el, ms > SLOW_MS ? "Degraded" : "Healthy", ms, `${detail} · this build (v{{VERSION}})`);
      }
      if (c.expect === "json") {
        const j = await r.json();
        if (c.jsonKey && !(c.jsonKey in j)) return show(el, "Unhealthy", ms, `answer has no "${c.jsonKey}"`);
        if (c.jsonKey) detail += ` · ${c.jsonKey} = ${JSON.stringify(j[c.jsonKey]).slice(0, 80)}`;
      } else if (c.expect) {
        const text = await r.text();
        if (!text.includes(c.expect)) return show(el, "Unhealthy", ms, `answer does not contain "${c.expect}"`);
      } else {
        const len = r.headers.get("content-length");
        if (len) detail += ` · ${(Number(len) / 1048576).toFixed(1)} MB`;
      }
      return show(el, ms > SLOW_MS ? "Degraded" : "Healthy", ms, ms > SLOW_MS ? detail + " · slow" : detail);
    } catch (e) {
      return show(el, "Unhealthy", performance.now() - t0, String(e && e.message || e));
    }
  }

  (async () => {
    const t0 = performance.now();
    const saved = cached();
    let results;
    if (saved) {
      results = CHECKS.map((c, i) => { const [st, ms, detail] = saved.rows[i]; return show(row(c), st, ms, detail); });
    } else {
      const rows = CHECKS.map(row);
      results = await Promise.all(CHECKS.map((c, i) => probeInto(rows[i], c)));
      try { sessionStorage.setItem(STORE_KEY, JSON.stringify({ at: Date.now(), rows: rows.map(el => JSON.parse(el.dataset.result)) })); } catch (e) { /* no storage */ }
    }
    const bad = CHECKS.filter((c, i) => results[i] === "Unhealthy").map(c => c.label);
    const slow = results.filter(s => s === "Degraded").length;
    const off = results.filter(s => s === "Off").length;
    const live = results.length - off;
    const offNote = off ? ` · ${off} off on purpose` : "";
    const b = document.getElementById("banner");
    if (bad.length) { b.textContent = "Not working: " + bad.join(", ") + offNote; b.className = "banner bad"; }
    else if (slow) { b.textContent = `Working, with ${slow} of ${live} live checks degraded` + offNote; b.className = "banner warn"; }
    else { b.textContent = `Everything is working (${live} live checks)` + offNote; b.className = "banner ok"; }
    const at = saved ? new Date(saved.at) : new Date();
    const checked = document.getElementById("checked");
    checked.textContent = saved
      ? `Probed ${Math.round((Date.now() - saved.at) / 1000)} s ago from this browser (${at.toISOString().replace("T", " ").slice(0, 19)} UTC), kept ${MAX_AGE_S} s. `
      : `Checked ${at.toISOString().replace("T", " ").slice(0, 19)} UTC from this browser in ${Math.round(performance.now() - t0)} ms (kept ${MAX_AGE_S} s). `;
    const again = document.createElement("a");
    again.href = "?fresh"; again.textContent = "Re-check now"; again.style.color = "var(--text)";
    checked.appendChild(again);
  })();
</script>
</body>
</html>
